<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - JUNSUI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#1a1a1a',
                            charcoal: '#2d2d2d',
                            accent: '#00C9A7',
                            glow: '#4FD1C5',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-effect {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-brand-dark text-white antialiased">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-effect transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-3xl font-bold tracking-tighter text-white">JUNSUI<span
                            class="text-brand-accent">.</span></a>
                </div>
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="index.html"
                        class="text-gray-300 hover:text-brand-accent transition-colors duration-300 text-sm font-medium tracking-wide">HOME</a>
                    <a href="products.html"
                        class="text-gray-300 hover:text-brand-accent transition-colors duration-300 text-sm font-medium tracking-wide">PRODUCTS</a>
                    <a href="about.html"
                        class="text-gray-300 hover:text-brand-accent transition-colors duration-300 text-sm font-medium tracking-wide">ABOUT</a>
                    <a href="contact.html"
                        class="text-brand-accent transition-colors duration-300 text-sm font-medium tracking-wide">CONTACT</a>
                </div>
                <!-- Icons & Mobile Button -->
                <div class="flex items-center space-x-4">
                    <a href="#" class="relative text-gray-300 hover:text-white transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 11V7a4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                        <span
                            class="absolute -top-2 -right-2 bg-brand-accent text-brand-dark text-[10px] font-bold h-4 w-4 flex items-center justify-center rounded-full group-hover:scale-110 transition-transform">0</span>
                    </a>
                    <button class="md:hidden text-gray-300 hover:text-white transition-colors" id="mobile-menu-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div class="md:hidden hidden bg-brand-dark/95 backdrop-blur-lg absolute w-full border-b border-gray-800"
            id="mobile-menu">
            <div class="px-4 pt-2 pb-6 space-y-2">
                <a href="index.html"
                    class="block px-3 py-2 text-base font-medium text-white hover:text-brand-accent">HOME</a>
                <a href="products.html"
                    class="block px-3 py-2 text-base font-medium text-white hover:text-brand-accent">PRODUCTS</a>
                <a href="about.html"
                    class="block px-3 py-2 text-base font-medium text-white hover:text-brand-accent">ABOUT</a>
                <a href="contact.html"
                    class="block px-3 py-2 text-base font-medium text-white text-brand-accent">CONTACT</a>
            </div>
        </div>
    </nav>

    <div class="min-h-screen pt-32 pb-20 flex items-center justify-center relative">
        <div
            class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1555529733-0e670560f7e1?q=80&w=2670&auto=format&fit=crop')] bg-cover bg-center opacity-10">
        </div>
        <div class="container mx-auto px-4 z-10">
            <div
                class="max-w-3xl mx-auto bg-gray-900/80 backdrop-blur-md p-10 rounded-2xl shadow-2xl border border-gray-800">
                <div class="text-center mb-10">
                    <h1 class="text-4xl font-bold text-white mb-2">Get in Touch</h1>
                    <p class="text-gray-400">Questions about our products or your order?</p>
                </div>

                <form class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label
                                class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Name</label>
                            <input type="text"
                                class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                                placeholder="John Doe">
                        </div>
                        <div>
                            <label
                                class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Email</label>
                            <input type="email"
                                class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                                placeholder="john@example.com">
                        </div>
                    </div>
                    <div>
                        <label
                            class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Subject</label>
                        <select
                            class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors">
                            <option>Order Inquiry</option>
                            <option>Product Question</option>
                            <option>Partnership</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-xs uppercase tracking-widest text-gray-500 mb-2 font-bold">Message</label>
                        <textarea
                            class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors h-32"
                            placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-brand-accent text-brand-dark font-bold py-4 rounded hover:bg-white transition-colors duration-300 tracking-widest">SEND
                        MESSAGE</button>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
